version: '3.8'

services:
  frontend:
    build:
      context: ./videohub-frontend
      dockerfile: Dockerfile
    container_name: videohub-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api
    depends_on:
      - backend
    networks:
      - videohub-network
    restart: unless-stopped

  backend:
    build:
      context: ./videohub-backend
      dockerfile: Dockerfile
    container_name: videohub-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW: 3600000
      RATE_LIMIT_MAX_REQUESTS: 100
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - videohub-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: videohub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - videohub-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: videohub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - videohub-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  videohub-network:
    driver: bridge
